name: Deploy to Production (kgs.trustbit.cloud)

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e

            echo "=== Finding bench directory ==="
            # Auto-detect bench path
            BENCH_PATH=""
            for path in /home/frappe/frappe-bench /home/$USER/frappe-bench /opt/bench/frappe-bench; do
              if [ -f "$path/Procfile" ]; then
                BENCH_PATH="$path"
                break
              fi
            done

            if [ -z "$BENCH_PATH" ]; then
              echo "ERROR: Could not find bench directory!"
              exit 1
            fi
            echo "Found bench at: $BENCH_PATH"

            echo "=== Taking backup ==="
            cd "$BENCH_PATH"
            bench --site $(cat sites/currentsite.txt) backup

            echo "=== Pulling latest code ==="
            cd "$BENCH_PATH/apps/trustbit_advance_search"
            git pull origin main

            echo "=== Building assets ==="
            cd "$BENCH_PATH"
            bench build --app trustbit_advance_search

            echo "=== Clearing cache ==="
            bench --site $(cat sites/currentsite.txt) clear-cache

            echo "=== Restarting services ==="
            sudo supervisorctl restart all 2>/dev/null || bench restart

            echo "=== Deployment complete! ==="
