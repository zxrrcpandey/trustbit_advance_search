name: Deploy to Production (splashbox.in) — MANUAL ONLY

# The push trigger is deliberately REMOVED.
#
# This workflow SSHes to `secrets.SERVER_HOST` and runs bench backup, bench
# migrate, bench build and `supervisorctl restart all`. On the push trigger,
# merging any commit into `main` — a README typo included — restarted production
# services, at whatever time the commit happened to land.
#
# It also still named `kgs.trustbit.cloud`, decommissioned in the 2026-08-23 move,
# so it would either deploy to a dead box or run a migrate for a site that does
# not exist on the live one.
#
# Production trades 10:30-19:30 IST on a 1-core server and CLAUDE.md forbids
# backups, migrates, builds and restarts inside that window — which an automatic
# trigger cannot know about. Run this by hand, outside shop hours.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            set -e

            BENCH_PATH="/home/frappe_user/frappe-bench"
            SITE="splashbox.in"
            APP="trustbit_advance_search"

            echo "=== Cleaning stale app references ==="
            cd "$BENCH_PATH"
            for stale_app in apps/*_backup_*; do
              if [ -d "$stale_app" ]; then
                stale_name=$(basename "$stale_app")
                echo "Removing stale app: $stale_name"
                rm -rf "$stale_app"
                sed -i "/$stale_name/d" sites/apps.txt 2>/dev/null || true
              fi
            done

            echo "=== Taking backup ==="
            su - frappe_user -c "cd $BENCH_PATH && bench --site $SITE backup"

            echo "=== Pulling latest code ==="
            cd "$BENCH_PATH/apps/$APP"
            git config --global --add safe.directory "$BENCH_PATH/apps/$APP"
            git pull origin main

            echo "=== Fixing permissions ==="
            chown -R frappe_user:frappe_user "$BENCH_PATH/apps/$APP"
            chmod 755 "$BENCH_PATH/apps/$APP"
            chmod -R o+rX "$BENCH_PATH/apps/$APP"

            echo "=== Building assets ==="
            su - frappe_user -c "cd $BENCH_PATH && bench build --app $APP"

            echo "=== Clearing cache ==="
            su - frappe_user -c "cd $BENCH_PATH && bench --site $SITE clear-cache"

            echo "=== Restarting services ==="
            supervisorctl restart all 2>/dev/null || su - frappe_user -c "cd $BENCH_PATH && bench restart"

            echo "=== Deployment complete! ==="
